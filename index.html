<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر غازا نت | Gaza Net Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #05050a; color: #e2e8f0; }
        .neon-glow-cyan { box-shadow: 0 0 15px rgba(0, 243, 255, 0.4); }
        .neon-glow-purple { box-shadow: 0 0 15px rgba(188, 19, 254, 0.4); }
        .neon-text { text-shadow: 0 0 10px rgba(0, 243, 255, 0.7); }
        .neon-border { border: 1px solid rgba(0, 243, 255, 0.5); }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4">

    <!-- رأس الصفحة -->
    <header class="w-full max-w-md mx-auto bg-gray-900/80 backdrop-blur-md neon-border rounded-2xl p-4 mb-6 flex justify-between items-center">
        <div>
            <h1 class="text-xl font-black text-cyan-400 neon-text">⚡ غازا نت</h1>
            <p class="text-xs text-gray-400">خدمات الإنترنت والكروت الرقمية</p>
        </div>
        <div id="user-info" class="text-left">
            <span id="display-phone" class="text-xs bg-gray-800 px-2 py-1 rounded-lg text-cyan-300">غير مسجل</span>
        </div>
    </header>

    <!-- المحتوى الرئيسي -->
    <main class="w-full max-w-md mx-auto flex-grow">
        
        <!-- شاشة تسجيل الدخول والتحقق عبر الواتساب -->
        <div id="auth-screen" class="bg-gray-900/90 neon-border rounded-2xl p-6 shadow-2xl space-y-4">
            <h2 class="text-lg font-bold text-center text-cyan-300">🔐 تسجيل الدخول / إنشاء حساب</h2>
            
            <!-- الخطوة 1: أدخل الرقم واطلب الكود -->
            <div id="step-1" class="space-y-3">
                <div>
                    <label class="block text-xs text-gray-400 mb-1">رقم الهاتف (اليمن)</label>
                    <input type="tel" id="phone-input" placeholder="73xxxxxxx أو 77xxxxxxx" required
                        class="w-full bg-gray-950 border border-gray-700 rounded-xl p-3 text-white focus:border-cyan-400 outline-none">
                </div>
                <button onclick="sendWhatsAppOTP()" class="w-full bg-green-600 hover:bg-green-500 text-white font-bold py-3 rounded-xl transition flex items-center justify-center gap-2">
                    💬 إرسال كود التحقق عبر الواتساب
                </button>
            </div>

            <!-- الخطوة 2: إدخال الكود وتأكيد الحساب -->
            <div id="step-2" class="hidden space-y-3 border-t border-gray-800 pt-3">
                <p class="text-xs text-green-400 text-center">تم توليد كود التحقق! أرسل الرسالة في الواتساب ثم ادخل الكود أدناه:</p>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">كود التحقق المرسل (OTP)</label>
                    <input type="number" id="otp-input" placeholder="أدخل الكود المكون من 4 أرقام" required
                        class="w-full bg-gray-950 border border-gray-700 rounded-xl p-3 text-white focus:border-cyan-400 outline-none text-center text-lg font-bold">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">تعيين الرمز السري للحساب (PIN)</label>
                    <input type="password" id="pin-input" placeholder="اختر رمزاً سرياً لحسابك" required
                        class="w-full bg-gray-950 border border-gray-700 rounded-xl p-3 text-white focus:border-cyan-400 outline-none">
                </div>
                <button onclick="verifyAndLogin()" class="w-full bg-cyan-500 hover:bg-cyan-400 text-gray-950 font-bold py-3 rounded-xl transition neon-glow-cyan">
                    تأكيد الدخول
                </button>
            </div>
        </div>

        <!-- شاشة المتجر الرئيسية -->
        <div id="store-screen" class="hidden space-y-6">
            <!-- بطاقة الرصيد -->
            <div class="bg-gradient-to-r from-gray-900 to-gray-800 neon-border rounded-2xl p-5 text-center neon-glow-purple">
                <p class="text-sm text-gray-400">رصيدك الحالي</p>
                <h3 class="text-3xl font-black text-purple-400 my-1"><span id="user-balance">0</span> <span class="text-sm">YER</span></h3>
                <button onclick="openWhatsAppRecharge()" class="mt-2 text-xs bg-green-600 hover:bg-green-500 text-white px-4 py-2 rounded-xl font-bold transition">
                    💬 طلب تعبئة رصيد عبر واتساب
                </button>
            </div>

            <!-- فئات الكروت المتاحة -->
            <div>
                <h3 class="text-sm font-bold text-cyan-300 mb-3">🎫 فئات كروت الواي فاي المتاحة</h3>
                <div id="cards-grid" class="grid grid-cols-2 gap-3">
                    <!-- تعبئة برمجية -->
                </div>
            </div>

            <!-- لوحة تحكم الأدمن (736822916) -->
            <div id="admin-panel" class="hidden bg-gray-900 border border-purple-500/50 rounded-2xl p-5 space-y-4 neon-glow-purple">
                <h3 class="text-sm font-bold text-purple-400">⚡ لوحة تحكم الأدمن (المدير)</h3>
                
                <!-- إضافة كرت -->
                <div class="space-y-2 border-t border-gray-800 pt-3">
                    <label class="text-xs text-gray-400">إضافة كرت جديد للمخزون</label>
                    <select id="admin-card-category" class="w-full bg-gray-950 border border-gray-700 rounded-lg p-2 text-xs text-white">
                        <option value="100">100 YER</option>
                        <option value="200">200 YER</option>
                        <option value="300">300 YER</option>
                        <option value="500">500 YER</option>
                        <option value="1000">1000 YER</option>
                        <option value="1500">1500 YER</option>
                        <option value="2500">2500 YER</option>
                        <option value="5000">5000 YER</option>
                    </select>
                    <input type="text" id="admin-card-code" placeholder="أدخل كود الكرت" class="w-full bg-gray-950 border border-gray-700 rounded-lg p-2 text-xs text-white">
                    <button onclick="addCardToStore()" class="w-full bg-purple-600 hover:bg-purple-500 text-white text-xs font-bold py-2 rounded-lg">إضافة الكرت للسحابة</button>
                </div>

                <!-- شحن رصيد -->
                <div class="space-y-2 border-t border-gray-800 pt-3">
                    <label class="text-xs text-gray-400">شحن رصيد لمشترك</label>
                    <input type="tel" id="admin-target-phone" placeholder="رقم الهاتف" class="w-full bg-gray-950 border border-gray-700 rounded-lg p-2 text-xs text-white">
                    <input type="number" id="admin-add-amount" placeholder="المبلغ" class="w-full bg-gray-950 border border-gray-700 rounded-lg p-2 text-xs text-white">
                    <button onclick="adminTopUpBalance()" class="w-full bg-green-600 hover:bg-green-500 text-white text-xs font-bold py-2 rounded-lg">تحديث الرصيد</button>
                </div>
            </div>
            
            <button onclick="logout()" class="w-full bg-red-900/40 hover:bg-red-900/60 text-red-300 text-xs py-2 rounded-xl border border-red-700/50">تسجيل الخروج</button>
        </div>
    </main>

    <footer class="w-full max-w-md mx-auto text-center mt-6 text-xs text-gray-500">
        <p>متجر غازا نت &copy; 2026 - جميع الحقوق محفوظة</p>
    </footer>

    <!-- سكربت Firebase والمنطق البرمجي -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, collection, addDoc, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // إعدادات الربط الخاصة بمشروعك gazanet-store
        const firebaseConfig = {
            apiKey: "AIzaSyAhT153ndoWN0OWV7YHA8S",
            authDomain: "gazanet-store.firebaseapp.com",
            projectId: "gazanet-store",
            storageBucket: "gazanet-store.appspot.com",
            messagingSenderId: "1071477123456",
            appId: "1:1071477123456:web:1234567890"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const ADMIN_PHONE = "736822916";
        const DENOMINATIONS = [100, 200, 300, 500, 1000, 1500, 2500, 5000];

        let generatedOTP = null;
        let currentUser = null;

        window.sendWhatsAppOTP = function() {
            const phone = document.getElementById('phone-input').value.trim();
            if (!phone || phone.length < 8) return alert('يرجى إدخال رقم هاتف صحيح');

            generatedOTP = Math.floor(1000 + Math.random() * 9000); // كود 4 أرقام
            const msg = `مرحباً، كود التحقق الخاص بي لتسجيل الدخول في متجر غازا نت هو: ${generatedOTP}`;
            window.open(`https://wa.me/967${ADMIN_PHONE}?text=${encodeURIComponent(msg)}`, '_blank');

            document.getElementById('step-2').classList.remove('hidden');
        }

        window.verifyAndLogin = async function() {
            const phone = document.getElementById('phone-input').value.trim();
            const otpEntered = document.getElementById('otp-input').value.trim();
            const pinEntered = document.getElementById('pin-input').value.trim();

            if (otpEntered != generatedOTP) {
                return alert('كود التحقق غير صحيح! يرجى التأكد من الرقم المولد.');
            }

            if (!pinEntered) return alert('يرجى اختيار رمز سري لحسابك');

            const userRef = doc(db, "users", phone);
            const userSnap = await getDoc(userRef);

            if (userSnap.exists()) {
                const userData = userSnap.data();
                if (userData.pin && userData.pin !== pinEntered) {
                    return alert('الرمز السري (PIN) الخاص بهذا الحساب غير صحيح!');
                }
                currentUser = { phone, ...userData };
            } else {
                const newUser = { pin: pinEntered, balance: 0, createdAt: new Date().toISOString() };
                await setDoc(userRef, newUser);
                currentUser = { phone, ...newUser };
            }

            initStore();
        }

        window.initStore = async function() {
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('store-screen').classList.remove('hidden');
            document.getElementById('display-phone').innerText = currentUser.phone;
            document.getElementById('user-balance').innerText = currentUser.balance;

            if (currentUser.phone === ADMIN_PHONE) {
                document.getElementById('admin-panel').classList.remove('hidden');
            }

            loadCards();
        }

        async function loadCards() {
            const grid = document.getElementById('cards-grid');
            grid.innerHTML = '';
            const querySnapshot = await getDocs(collection(db, "cards"));
            let cardsMap = {};
            DENOMINATIONS.forEach(d => cardsMap[d] = 0);

            querySnapshot.forEach((doc) => {
                const data = doc.data();
                if (data.status === 'available' && cardsMap[data.category] !== undefined) {
                    cardsMap[data.category]++;
                }
            });

            DENOMINATIONS.forEach(amount => {
                const count = cardsMap[amount];
                const cardDiv = document.createElement('div');
                cardDiv.className = "bg-gray-900 neon-border p-4 rounded-xl text-center space-y-2";
                cardDiv.innerHTML = `
                    <h4 class="text-base font-bold text-cyan-300">كرت ${amount} YER</h4>
                    <p class="text-xs text-gray-400">المتاح: <span class="text-white font-bold">${count}</span> كرت</p>
                    <button onclick="buyCard(${amount})" class="w-full bg-cyan-600 hover:bg-cyan-500 text-white text-xs py-2 rounded-lg font-bold transition">شراء</button>
                `;
                grid.appendChild(cardDiv);
            });
        }

        window.buyCard = async function(amount) {
            if (currentUser.balance < amount) {
                return alert('رصيدك غير كافٍ! يرجى تعبئة رصيدك أولاً.');
            }

            const q = query(collection(db, "cards"), where("category", "==", amount), where("status", "==", "available"));
            const querySnapshot = await getDocs(q);

            if (querySnapshot.empty) {
                return alert('عذراً، نفدت كروت هذه الفئة حالياً!');
            }

            const cardDoc = querySnapshot.docs[0];
            const cardData = cardDoc.data();

            if (!confirm(`هل أنت متأكد من شراء كرت فئة ${amount} ريال؟`)) return;

            const newBalance = currentUser.balance - amount;
            await updateDoc(doc(db, "users", currentUser.phone), { balance: newBalance });
            await updateDoc(doc(db, "cards", cardDoc.id), { status: 'sold', buyer: currentUser.phone });

            currentUser.balance = newBalance;
            document.getElementById('user-balance').innerText = newBalance;

            alert(`🎉 تم الشراء بنجاح!\n\nكود الكرت:\n${cardData.code}`);
            loadCards();
        }

        window.addCardToStore = async function() {
            const category = document.getElementById('admin-card-category').value;
            const code = document.getElementById('admin-card-code').value.trim();

            if (!code) return alert('يرجى إدخال كود الكرت');

            await addDoc(collection(db, "cards"), {
                category: Number(category),
                code: code,
                status: 'available',
                createdAt: new Date().toISOString()
            });

            document.getElementById('admin-card-code').value = '';
            alert('تمت إضافة الكرت بنجاح إلى السحابة!');
            loadCards();
        }

        window.adminTopUpBalance = async function() {
            const phone = document.getElementById('admin-target-phone').value.trim();
            const amount = Number(document.getElementById('admin-add-amount').value);

            if (!phone || isNaN(amount)) return alert('يرجى إدخال البيانات بشكل صحيح');

            const targetRef = doc(db, "users", phone);
            const targetSnap = await getDoc(targetRef);

            if (!targetSnap.exists()) return alert('المستخدم غير مسجل في النظام!');

            const currentBal = targetSnap.data().balance || 0;
            const newBal = currentBal + amount;

            await updateDoc(targetRef, { balance: newBal });
            alert(`تم شحن رصيد رقم ${phone} بنجاح وأصبح رصيده ${newBal} YER`);
            document.getElementById('admin-target-phone').value = '';
            document.getElementById('admin-add-amount').value = '';
        }

        window.openWhatsAppRecharge = function() {
            const msg = `مرحباً، أود تعبئة رصيدي في متجر غازا نت. رقم هاتفي هو: ${currentUser.phone}`;
            window.open(`https://wa.me/967${ADMIN_PHONE}?text=${encodeURIComponent(msg)}`, '_blank');
        }

        window.logout = function() {
            location.reload();
        }
    </script>
</body>
</html>
